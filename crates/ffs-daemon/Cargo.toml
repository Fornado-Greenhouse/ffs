[package]
name = "ffs-daemon"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true

[lib]
name = "ffs_daemon"
path = "src/lib.rs"

[[bin]]
name = "ffs-daemon"
path = "src/main.rs"

[dependencies]
ffs-core = { workspace = true }
ffs-federation = { workspace = true }
# `ffs-skills-host` was a dev-dep through task_22; task_26 promotes
# it to a regular dep so the daemon binary can spawn the scribe
# subprocess. `ffs-skills-host` itself only depends on `ffs-core`.
ffs-skills-host = { workspace = true }
# task_49 / ADR-036: the dependency was inverted. `Event` and
# `EventPublisher` moved to `ffs-core::events`, so `ffs-fastpath` no
# longer depends on this crate and the daemon binary can start the
# fast-path watcher and implement its `DecisionSink` in-process.
ffs-fastpath = { workspace = true }

serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
time = { workspace = true, features = ["parsing", "formatting"] }
tokio = { workspace = true }
tokio-util = { workspace = true }
futures = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
dirs = { workspace = true }
async-trait = { workspace = true }
ed25519-dalek = { workspace = true, features = ["rand_core"] }
rand = { workspace = true }
notify = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
ed25519-dalek = { workspace = true, features = ["rand_core"] }
ffs-federation = { workspace = true }
serde_json = { workspace = true }

[lints]
workspace = true

# courier.toml — what the courier reads and where it writes (task_40).
#
# Installed to $FFS_DATA_DIR/config/courier.toml. Owner-edited. No
# secrets here: the mailbox password is the OS keychain item
# `ffs.courier.<host>` (or FFS_COURIER_MAIL_PASSWORD for tests), and
# a key named password, token, secret, or cookie makes the loader
# refuse the file. Per-publisher policy (intake and fetch) lives in
# sources.toml, not here.

[mailbox]
host = "imap.gmail.com"        # Google Workspace: use an app password (2-step verification required)
port = 993
folder = "INBOX"
auth = "app_password"          # "oauth" is accepted but not implemented in this release
user = ""                      # the mailbox address, e.g. you@yourdomain.example
mark_seen = true               # mark a digest seen only after every item's file was written
timeout_seconds = 60           # socket timeout per IMAP operation; without one a stalled server hangs the tick forever

# Each source pairs a sender with a publisher key from sources.toml.
[[mailbox.source]]
sender = "reply@news.bizjournals.com"
subject_filter = ""
publisher = "bizjournals"

[[mailbox.source]]
sender = "hello@clttoday.com"
publisher = "clttoday"

